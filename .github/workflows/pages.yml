name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
      - wallpaper-station
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test full-text search
        run: node --test test/flatpaper-search.test.cjs

      - name: Test wallpaper ingestion and fallback
        run: node --test test/wallpapers.test.cjs test/wallpapers.commons.test.cjs test/wallpapers.commons.collector.test.cjs test/wallpapers.feeds.test.cjs test/wallpapers.repositories.test.cjs test/wallpapers.previews.test.cjs test/wallpapers.pepper-artworks.test.cjs test/wallpapers.morevna.test.cjs test/wallpapers.ayomi.test.cjs test/wallpapers.opengameart.test.cjs test/wallpapers.revoy.test.cjs test/wallpapers.tyson.test.cjs test/wallpapers.hdwallpapers.test.cjs test/wallpapers.wallcolle.test.cjs test/wallpapers.sermor.test.cjs test/wallpapers.blender.test.cjs test/wallpapers.pop.test.cjs test/wallpapers.unicorn.test.cjs test/wallpapers.release.test.cjs test/wallpapers.eso.test.cjs

      - name: Checkout music station
        uses: actions/checkout@v4
        with:
          repository: fengzhouxuan/musicsquare
          ref: main
          path: .music-station
          persist-credentials: false

      - name: Export music station
        run: node .music-station/scripts/export-site.mjs source/music

      - name: Preserve committed wallpaper seed
        run: cp source/wallpapers/data/official-feeds.json "$RUNNER_TEMP/wallpaper-official-seed.json"

      - name: Restore wallpaper catalog from the previous build
        uses: actions/cache/restore@v4
        with:
          path: |
            source/wallpapers/data/official-feeds.json
            source/wallpapers/data/open-images.json
            source/wallpapers/data/previews.json
            source/wallpapers/previews
            source/wallpapers/originals/opengameart
            source/wallpapers/originals/hdwallpapers
            source/wallpapers/originals/blender
            source/wallpapers/originals/unicorn
          key: wallpaper-catalog-v3-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wallpaper-catalog-v3-${{ github.ref_name }}-
            wallpaper-catalog-v2-${{ github.ref_name }}-
            wallpaper-catalog-v3-main-
            wallpaper-catalog-v2-main-

      - name: Refresh open wallpaper catalogs
        run: node scripts/refresh-wallpaper-feeds.cjs
        env:
          WALLPAPER_SEED_CATALOG: ${{ runner.temp }}/wallpaper-official-seed.json

      - name: Refresh open wallpaper photography
        run: node scripts/refresh-wallpaper-commons.cjs

      - name: Build optimized wallpaper previews
        run: node scripts/build-wallpaper-previews.cjs

      - name: Save validated wallpaper catalog
        uses: actions/cache/save@v4
        with:
          path: |
            source/wallpapers/data/official-feeds.json
            source/wallpapers/data/open-images.json
            source/wallpapers/data/previews.json
            source/wallpapers/previews
            source/wallpapers/originals/opengameart
            source/wallpapers/originals/hdwallpapers
            source/wallpapers/originals/blender
            source/wallpapers/originals/unicorn
          key: wallpaper-catalog-v3-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Hexo
        run: npm run build

      - name: Verify wallpaper files before publication
        run: |
          wallpaper_exit=0
          node scripts/verify-wallpaper-release.cjs > "$RUNNER_TEMP/wallpaper-release.log" 2>&1 || wallpaper_exit=$?
          cat "$RUNNER_TEMP/wallpaper-release.log"
          cat "$RUNNER_TEMP/wallpaper-release.log" >> "$GITHUB_STEP_SUMMARY"
          if [ "$wallpaper_exit" -ne 0 ]; then
            node -e 'const text=require("node:fs").readFileSync(0,"utf8").trim(); console.log("::error::"+text.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));' < "$RUNNER_TEMP/wallpaper-release.log"
          fi
          exit "$wallpaper_exit"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
