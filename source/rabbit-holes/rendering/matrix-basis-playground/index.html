<style>:root {

    --background,

    --color-background-primary,

  );
  --foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --card: color-mix(in oklab, var(--foreground) 5%, transparent);
  --card-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --popover: var(
    --color-background-secondary,
    light-dark(rgb(255 255 255), rgb(45 45 45))
  );
  --popover-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --primary: var(
    --color-text-info,
    light-dark(rgb(51 156 255), rgb(131 195 255))
  );
  --primary-foreground: var(
    --color-text-inverse,
    light-dark(rgb(255 255 255), rgb(13 13 13))
  );
  --secondary: var(
    --color-background-secondary,

  );
  --secondary-foreground: var(
    --color-text-primary,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --muted: color-mix(in srgb, var(--foreground) 10%, transparent);
  --muted-foreground: var(
    --color-text-secondary,
    light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%))
  );
  --accent: var(
    --color-background-info,
    light-dark(rgb(229 242 255), rgb(13 39 63))
  );
  --accent-foreground: var(
    --color-text-info,
    light-dark(rgb(51 156 255), rgb(131 195 255))
  );
  --destructive: var(
    --color-text-warning,
    light-dark(rgb(226 85 7), rgb(255 133 73))
  );
  --border: var(
    --color-border-secondary,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );
  --input: var(
    --color-border-primary,
    light-dark(

  --ring: var(

  --font-size-base: var(--font-text-md-size, 14px);
  --red: light-dark(rgb(186 38 35), rgb(250 66 62));

  --viz-series-1: var(--primary);
  --viz-series-2: light-dark(rgb(243 136 59), rgb(245 154 86));
  --viz-series-3: light-dark(rgb(93 201 119), rgb(116 213 139));
  --viz-series-4: light-dark(rgb(235 119 177), rgb(240 143 192));
  --viz-series-5: light-dark(rgb(155 121 236), rgb(170 145 239));
  --viz-series-6: light-dark(rgb(58 185 177), rgb(90 203 194));

  /* Internal implementation variables; not part of the agent contract. */
  --font-sans: -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono:
    ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono",
    monospace;
  --font-size-normal: max(11px, var(--font-size-base));
  --font-size-tooltip: calc(var(--font-size-base) - 1px);
  --font-size-small: max(11px, calc(var(--font-size-base) - 2px));
  --font-size-h1: calc(var(--font-size-normal) * 1.7142857143);
  --font-size-h2: calc(var(--font-size-normal) * 1.4285714286);

  --font-weight-normal: 430;

  --line-height-small: calc(var(--font-size-small) + 4px);
  --radius: var(--border-radius-lg, 12.5px);
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);
  --radius-2xl: calc(var(--radius) * 1.6);

  /* Legacy aliases; not part of the current agent contract. */
  --viz-bg: transparent;

  --viz-border: var(--border);

  --viz-muted: var(--muted-foreground);
  --viz-accent: var(--primary);
  --viz-accent-text: var(--primary-foreground);
  --viz-accent-bg: var(--accent);
  --viz-font-size: var(--font-size-base);
  --viz-warning: var(--destructive);

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html>body{padding:0}</style>
</head>
<body>
<div id="matrix-basis-playground">
  <div class="viz-controls" aria-label="二维矩阵参数">
    <label class="form-label" for="mbp-a">
      <span><code>a</code>：<span id="mbp-a-value">1.00</span></span>
      <input class="form-range" id="mbp-a" type="range" min="-2" max="2" step="0.05" value="1">
    </label>
    <label class="form-label" for="mbp-b">
      <span><code>b</code>：<span id="mbp-b-value">0.00</span></span>
      <input class="form-range" id="mbp-b" type="range" min="-2" max="2" step="0.05" value="0">
    </label>
    <label class="form-label" for="mbp-c">
      <span><code>c</code>：<span id="mbp-c-value">0.00</span></span>
      <input class="form-range" id="mbp-c" type="range" min="-2" max="2" step="0.05" value="0">
    </label>
    <label class="form-label" for="mbp-d">
      <span><code>d</code>：<span id="mbp-d-value">1.00</span></span>
      <input class="form-range" id="mbp-d" type="range" min="-2" max="2" step="0.05" value="1">
    </label>
    <button class="btn" id="mbp-reset" type="button">恢复单位矩阵</button>
  </div>

  <div class="viz-row text-small" aria-live="polite">
    <code id="mbp-matrix">[[1.00, 0.00], [0.00, 1.00]]</code>
    <span id="mbp-detail">面积 ×1.00，方向不变</span>
  </div>

  <svg id="mbp-svg" viewBox="0 0 720 430" role="img" aria-labelledby="mbp-title mbp-desc">
    <title id="mbp-title">二维矩阵对坐标网格和基向量的变换</title>
    <desc id="mbp-desc">灰色网格是变换前坐标系，彩色网格是变换后坐标系，两支箭头分别表示矩阵的第一列和第二列。</desc>
    <defs>
      <clipPath id="mbp-clip">
        <rect x="0" y="0" width="720" height="430"></rect>
      </clipPath>
    </defs>
    <g clip-path="url(#mbp-clip)">
      <g id="mbp-original-grid"></g>
      <g id="mbp-transformed-grid"></g>
      <g id="mbp-axes"></g>
      <polygon id="mbp-original-square" points="" class="mbp-original-square"></polygon>
      <polygon id="mbp-transformed-square" points="" class="mbp-transformed-square"></polygon>
      <g id="mbp-e1-arrow"></g>
      <g id="mbp-e2-arrow"></g>
      <circle id="mbp-origin" r="4"></circle>
      <text id="mbp-origin-label">原点</text>
      <text id="mbp-e1-label"></text>
      <text id="mbp-e2-label"></text>
      <text id="mbp-sum-label"></text>
    </g>
  </svg>
</div>

<style>
  #matrix-basis-playground {
    color: var(--foreground);
  }

  #matrix-basis-playground .viz-controls {
    align-items: end;
  }

  #matrix-basis-playground .form-label {
    flex: 1 1 140px;
  }

  #matrix-basis-playground .viz-row {
    justify-content: space-between;
  }

  #matrix-basis-playground #mbp-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  #matrix-basis-playground .mbp-grid-line {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
  }

  #matrix-basis-playground .mbp-transformed-line {
    fill: none;
    stroke: var(--viz-series-1);
    stroke-width: 1.5;
    opacity: 0.62;
  }

  #matrix-basis-playground .mbp-axis {
    stroke: var(--muted-foreground);
    stroke-width: 1.5;
  }

  #matrix-basis-playground .mbp-original-square {
    fill: var(--muted);
    fill-opacity: 0.28;
    stroke: var(--muted-foreground);
    stroke-width: 1.5;
  }

  #matrix-basis-playground .mbp-transformed-square {
    fill: var(--viz-series-1);
    fill-opacity: 0.16;
    stroke: var(--viz-series-1);
    stroke-width: 2;
  }

  #matrix-basis-playground .mbp-e1 {
    fill: var(--viz-series-2);
    stroke: var(--viz-series-2);
    stroke-width: 3;
  }

  #matrix-basis-playground .mbp-e2 {
    fill: var(--viz-series-3);
    stroke: var(--viz-series-3);
    stroke-width: 3;
  }

  #matrix-basis-playground #mbp-origin {
    fill: var(--foreground);
  }

  #matrix-basis-playground text {
    fill: var(--foreground);
    font-size: var(--font-size-base);
  }

  #matrix-basis-playground #mbp-origin-label {
    fill: var(--muted-foreground);
  }

  @media (max-width: 520px) {
    #matrix-basis-playground {
      min-width: 0;
    }

    #matrix-basis-playground .viz-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
    }

    #matrix-basis-playground .form-label {
      width: 100%;
      min-width: 0;
    }

    #matrix-basis-playground .viz-row {
      flex-direction: column;
      align-items: flex-start;
    }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("matrix-basis-playground");
    const svg = root.querySelector("#mbp-svg");
    const ns = "http://www.w3.org/2000/svg";
    const inputs = {
      a: root.querySelector("#mbp-a"),
      b: root.querySelector("#mbp-b"),
      c: root.querySelector("#mbp-c"),
      d: root.querySelector("#mbp-d")
    };
    const values = {
      a: root.querySelector("#mbp-a-value"),
      b: root.querySelector("#mbp-b-value"),
      c: root.querySelector("#mbp-c-value"),
      d: root.querySelector("#mbp-d-value")
    };
    const originalGrid = root.querySelector("#mbp-original-grid");
    const transformedGrid = root.querySelector("#mbp-transformed-grid");
    const axes = root.querySelector("#mbp-axes");
    const originalSquare = root.querySelector("#mbp-original-square");
    const transformedSquare = root.querySelector("#mbp-transformed-square");
    const e1Arrow = root.querySelector("#mbp-e1-arrow");
    const e2Arrow = root.querySelector("#mbp-e2-arrow");
    const origin = root.querySelector("#mbp-origin");
    const originLabel = root.querySelector("#mbp-origin-label");
    const e1Label = root.querySelector("#mbp-e1-label");
    const e2Label = root.querySelector("#mbp-e2-label");
    const sumLabel = root.querySelector("#mbp-sum-label");
    const matrixLabel = root.querySelector("#mbp-matrix");
    const detail = root.querySelector("#mbp-detail");
    const reset = root.querySelector("#mbp-reset");

    const center = { x: 360, y: 215 };
    const scale = 48;
    const extent = 4.5;

    function point(x, y) {
      return {
        x: center.x + x * scale,
        y: center.y - y * scale
      };
    }

    function transform(x, y, matrix) {
      return {
        x: matrix.a * x + matrix.b * y,
        y: matrix.c * x + matrix.d * y
      };
    }

    function svgLine(parent, p1, p2, className) {
      const line = document.createElementNS(ns, "line");
      line.setAttribute("x1", p1.x);
      line.setAttribute("y1", p1.y);
      line.setAttribute("x2", p2.x);
      line.setAttribute("y2", p2.y);
      line.setAttribute("class", className);
      parent.appendChild(line);
      return line;
    }

    function polygonPoints(points) {
      return points.map((p) => {
        const mapped = point(p.x, p.y);
        return `${mapped.x},${mapped.y}`;
      }).join(" ");
    }

    function drawArrow(parent, startWorld, endWorld, className) {
      parent.replaceChildren();
      const start = point(startWorld.x, startWorld.y);
      const end = point(endWorld.x, endWorld.y);
      svgLine(parent, start, end, className);

      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const length = Math.hypot(dx, dy);
      if (length < 2) return;

      const ux = dx / length;
      const uy = dy / length;
      const size = 11;
      const wing = 5;
      const head = document.createElementNS(ns, "polygon");
      head.setAttribute("points", [
        `${end.x},${end.y}`,
        `${end.x - ux * size - uy * wing},${end.y - uy * size + ux * wing}`,
        `${end.x - ux * size + uy * wing},${end.y - uy * size - ux * wing}`
      ].join(" "));
      head.setAttribute("class", className);
      parent.appendChild(head);
    }

    function setTextPosition(element, worldPoint, offsetX, offsetY) {
      const mapped = point(worldPoint.x, worldPoint.y);
      element.setAttribute("x", mapped.x + offsetX);
      element.setAttribute("y", mapped.y + offsetY);
    }

    function drawStaticGrid() {
      originalGrid.replaceChildren();
      axes.replaceChildren();

      for (let i = -4; i <= 4; i += 1) {
        svgLine(originalGrid, point(i, -extent), point(i, extent), "mbp-grid-line");
        svgLine(originalGrid, point(-extent, i), point(extent, i), "mbp-grid-line");
      }

      svgLine(axes, point(-extent, 0), point(extent, 0), "mbp-axis");
      svgLine(axes, point(0, -extent), point(0, extent), "mbp-axis");

      originalSquare.setAttribute("points", polygonPoints([
        { x: 0, y: 0 },
        { x: 1, y: 0 },
        { x: 1, y: 1 },
        { x: 0, y: 1 }
      ]));

      const originPoint = point(0, 0);
      origin.setAttribute("cx", originPoint.x);
      origin.setAttribute("cy", originPoint.y);
      originLabel.setAttribute("x", originPoint.x + 8);
      originLabel.setAttribute("y", originPoint.y + 20);
    }

    function update() {
      const matrix = {
        a: Number(inputs.a.value),
        b: Number(inputs.b.value),
        c: Number(inputs.c.value),
        d: Number(inputs.d.value)
      };

      Object.keys(matrix).forEach((key) => {
        values[key].textContent = matrix[key].toFixed(2);
      });

      transformedGrid.replaceChildren();
      for (let i = -4; i <= 4; i += 1) {
        const verticalStart = transform(i, -extent, matrix);
        const verticalEnd = transform(i, extent, matrix);
        const horizontalStart = transform(-extent, i, matrix);
        const horizontalEnd = transform(extent, i, matrix);
        svgLine(
          transformedGrid,
          point(verticalStart.x, verticalStart.y),
          point(verticalEnd.x, verticalEnd.y),
          "mbp-transformed-line"
        );
        svgLine(
          transformedGrid,
          point(horizontalStart.x, horizontalStart.y),
          point(horizontalEnd.x, horizontalEnd.y),
          "mbp-transformed-line"
        );
      }

      const e1 = { x: matrix.a, y: matrix.c };
      const e2 = { x: matrix.b, y: matrix.d };
      const sum = { x: e1.x + e2.x, y: e1.y + e2.y };

      transformedSquare.setAttribute("points", polygonPoints([
        { x: 0, y: 0 },
        e1,
        sum,
        e2
      ]));

      drawArrow(e1Arrow, { x: 0, y: 0 }, e1, "mbp-e1");
      drawArrow(e2Arrow, { x: 0, y: 0 }, e2, "mbp-e2");

      e1Label.textContent = `第一列 e₁ → (${matrix.a.toFixed(2)}, ${matrix.c.toFixed(2)})`;
      e2Label.textContent = `第二列 e₂ → (${matrix.b.toFixed(2)}, ${matrix.d.toFixed(2)})`;
      sumLabel.textContent = `e₁ + e₂ → (${sum.x.toFixed(2)}, ${sum.y.toFixed(2)})`;
      e1Label.setAttribute("text-anchor", "start");
      e2Label.setAttribute("text-anchor", "end");
      sumLabel.setAttribute("text-anchor", "start");
      setTextPosition(e1Label, e1, 10, 22);
      setTextPosition(e2Label, e2, -10, -10);
      setTextPosition(sumLabel, sum, 10, -10);

      const determinant = matrix.a * matrix.d - matrix.b * matrix.c;
      let orientation = "方向不变";
      if (determinant < -0.005) orientation = "方向翻转";
      if (Math.abs(determinant) <= 0.005) orientation = "平面被压扁";

      matrixLabel.textContent =
        `[[${matrix.a.toFixed(2)}, ${matrix.b.toFixed(2)}], ` +
        `[${matrix.c.toFixed(2)}, ${matrix.d.toFixed(2)}]]`;
      detail.textContent = `面积 ×${Math.abs(determinant).toFixed(2)}，${orientation}`;

      svg.setAttribute(
        "aria-label",
        `矩阵第一列变为 ${matrix.a.toFixed(2)}, ${matrix.c.toFixed(2)}，` +
        `第二列变为 ${matrix.b.toFixed(2)}, ${matrix.d.toFixed(2)}，` +
        `行列式为 ${determinant.toFixed(2)}`
      );
    }

    Object.values(inputs).forEach((input) => {
      input.addEventListener("input", update);
    });

    reset.addEventListener("click", () => {
      inputs.a.value = "1";
      inputs.b.value = "0";
      inputs.c.value = "0";
      inputs.d.value = "1";
      update();
    });

    drawStaticGrid();
    update();
  })();
</script>

<script src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>
<script src="https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js"></script>
<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-lucide" async src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>

<script>
(() => {
  function syncParentTheme() {
    try {
      document.documentElement.style.colorScheme = parent.document.documentElement.classList.contains("dark-mode") ? "dark" : "light";
    } catch (_) {}
  }
  syncParentTheme();
  try {
    new MutationObserver(syncParentTheme).observe(parent.document.documentElement, { attributes: true, attributeFilter: ["class"] });
  } catch (_) {}
})();
</script>
